name: reboot_app
description: "REBOOT weekly remaining-to-live budget application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.2
  flutter_secure_storage: 10.3.1
  intl: 0.20.2
  path: 1.9.1
  path_provider: 2.1.6
  reboot_application: ^0.1.0
  reboot_domain: ^0.1.0
  reboot_projection: ^0.1.0
  reboot_serialization: ^0.1.0
  reboot_storage: ^0.1.0
  timezone: 0.11.1
  web: 1.1.1

dev_dependencies:
  crypto: 3.0.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: 1.31.0

flutter:
  generate: true
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
