name: reboot_workspace
description: Workspace for the REBOOT mobile application and pure Dart engines.
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - apps/reboot_app
  - packages/reboot_application
  - packages/reboot_domain
  - packages/reboot_projection
  - packages/reboot_storage

dev_dependencies:
  lints: ^6.1.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
