name: reboot_storage
description: Encrypted local SQLite event journal for REBOOT.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  drift: 2.34.0
  path: 1.9.1
  reboot_application: ^0.1.0
  reboot_domain: ^0.1.0
  sqlite3: 3.5.0

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  reboot_projection: ^0.1.0
  test: 1.31.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
