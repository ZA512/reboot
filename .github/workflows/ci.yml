name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Validate workspace
        run: dart run tool/check.dart

      - name: Build Android debug application
        working-directory: apps/reboot_app
        run: flutter build apk --debug

      - name: Verify domain exactness in JavaScript
        working-directory: packages/reboot_domain
        run: |
          dart compile js tool/web_exactness_probe.dart -O2 --output=build/web_exactness_probe.js
          node build/web_exactness_probe.js

      - name: Verify exact money formatting in JavaScript
        working-directory: apps/reboot_app
        run: |
          dart compile js tool/web_money_format_probe.dart -O2 --output=build/web_money_format_probe.js
          node build/web_money_format_probe.js

      - name: Verify encrypted browser journal in Chrome
        working-directory: apps/reboot_app
        run: >-
          dart test -p chrome
          test/browser/browser_encrypted_journal_prototype_test.dart
          test/browser/browser_local_event_journal_test.dart
          test/browser/browser_recovery_archive_test.dart
          test/browser/browser_recovery_document_portal_test.dart
          test/browser/browser_recovery_workflow_test.dart
          test/browser/browser_storage_durability_test.dart

      - name: Compile browser storage for JavaScript and WebAssembly
        working-directory: apps/reboot_app
        run: |
          dart compile js tool/web_storage_compile_probe.dart -O2 --output=build/web_storage_compile_probe.js
          dart compile wasm tool/web_storage_compile_probe.dart --output=build/web_storage_compile_probe.wasm

      - name: Build versioned offline Web shell
        working-directory: apps/reboot_app
        run: dart run tool/build_web_release.dart

      - name: Validate generated service worker
        working-directory: apps/reboot_app
        run: |
          node --check build/web/reboot_service_worker.js
          test ! -e build/web/flutter_service_worker.js
          grep -q "reboot-shell-" build/web/reboot_service_worker.js
